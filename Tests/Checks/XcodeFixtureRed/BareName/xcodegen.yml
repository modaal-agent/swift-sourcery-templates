# The red control: a config naming a template by bare name. Under SPM that
# resolves against the shipped `templates/` directory; an Xcode project is handed
# no package graph, so it cannot, and the build must fail saying why.
#
# A project of its own, for the reason Tests/Checks/PluginFixtureRed's packages
# are separate: build planning runs the plugin for every target being built, so a
# plan-time failure cannot share a project with a target that has to stay green.
name: BareName
options:
  createIntermediateGroups: true
  bundleIdPrefix: com.example.barename
packages:
  SwiftSourceryTemplates:
    path: ../../../..
targets:
  BareName:
    type: framework
    platform: macOS
    deploymentTarget: '13.0'
    sources: [Sources]
    buildToolPlugins:
      - plugin: SourcerySwiftCodegenPlugin
        package: SwiftSourceryTemplates
schemes:
  BareName:
    build:
      targets: {BareName: all}
