name: CI

# Push-triggered on every branch. Tag pushes are excluded: a tag is cut from a
# commit that was already built, so running again would only duplicate the
# result.
#
# `branches` must be spelled out, and this is the whole trigger — do not
# "simplify" it back to a bare `tags-ignore`. From the workflow-syntax
# reference: "If you define only `tags`/`tags-ignore` or only
# `branches`/`branches-ignore`, the workflow won't run for events affecting the
# undefined Git ref." A lone `tags-ignore: ['**']` therefore leaves branches
# undefined *and* excludes every tag, so the push trigger can never fire at all
# — which is what it did here from the day this file was written until
# 2026-09-09: every CI run in the history was a manual workflow_dispatch.
#
# With `branches` defined and no tag filter, tags are the undefined ref and are
# excluded on their own, so no `tags-ignore` is needed. `'**'` rather than `'*'`
# because `*` does not match a `/`, and branches here are named `spec/001-...`.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Xcode is pinned rather than tracking the runner image. The `checks` job's
# gate is *zero diagnostics*, not zero errors, so a compiler that adds one new
# warning turns it red for a reason that has nothing to do with the templates.
# Pinning makes that a deliberate bump. The gate was measured to hold on Swift
# 6.3.3 (Xcode 26.6) and Swift 6.4 (Xcode 27 beta 4), so the pin is for
# reproducibility, not fragility.
env:
  XCODE_VERSION: '26.3'
  SOURCERY_VERSION: '2.3.0'

jobs:
  # ── Rules lane ───────────────────────────────────────────────────
  # AGENTS.md and CLAUDE.md are one file kept in two places, so that an agent
  # reading either gets the same rules. This repository once carried different
  # material in each and the copies drifted. The only lane that reads markdown
  # and nothing else: no Swift toolchain, no Xcode, no macOS runner, so it runs
  # on ubuntu in seconds and reports before the others have finished booting.
  rules:
    name: Rules files (AGENTS.md == CLAUDE.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: AGENTS.md and CLAUDE.md are byte-identical
        # Fix a failure with `cp AGENTS.md CLAUDE.md`.
        run: cmp AGENTS.md CLAUDE.md

  # ── Annotation registry lane ─────────────────────────────────────
  # `templates/Annotations/AnnotationRegistry.swift` is the one place an
  # annotation verb is named, and every document that documents one carries a
  # block rendered from it. This lane checks both directions of that rule and
  # the freshness of every rendition.
  #
  # Ungated, for the same reason `rules` is, and it matters more here: a push
  # that edits only `README.md` sets `code=false` below and skips all five macOS
  # lanes, and a hand-edited annotation table is exactly what such a push
  # produces. Shell, `grep` and `awk` only — no Swift toolchain, no Sourcery, no
  # network — so it runs on ubuntu in seconds.
  annotations:
    name: Annotations (registry, rendition)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Registry and rendition
        run: Tests/Checks/run-annotation-checks.sh

      - name: Red controls — each check red on a seeded violation
        run: Tests/Checks/run-annotation-checks.sh --self-test

  # ── Skill lane ───────────────────────────────────────────────────
  # `skills/` is published to adopters through four channels, and two of this
  # script's checks are the reason it lives in this repository at all: every
  # `SOURCERY_*` variable and every `mock-templates` flag the skill writes is
  # compared against the plugin source and `Commands.swift` on the push that
  # changes either side.
  #
  # Ungated for the same reason `rules` and `annotations` are, and here the
  # filter below makes it load-bearing: a push touching only `skills/` or
  # `.claude-plugin/` skips every macOS lane, so this job is the only one that
  # reads what changed. Markdown, JSON and `python3` — no Swift toolchain, no
  # Sourcery, no network.
  skills:
    name: Skill (frontmatter, budgets, the names it claims)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skill tree and plugin manifests
        run: Tests/Checks/run-skill-checks.sh

      - name: Red controls — each check red on a seeded violation
        run: Tests/Checks/run-skill-checks.sh --self-test

  # ── Change filter ────────────────────────────────────────────────
  # Reports whether the push touched anything a build can read. Markdown cannot
  # break a Swift build, so a docs-only push skips the five macOS lanes rather
  # than spending about six minutes and a simulator boot to confirm a README is
  # still a README. Two more paths are documentation without being markdown:
  # `.claude-plugin/` holds the two manifests that publish the skill, and
  # `skills/` holds the skill tree, whose non-markdown files are its manifests'
  # companions. `templates/Annotations/` is deliberately not in the pattern —
  # it changes what the templates emit, so it runs every lane.
  #
  # The `rules`, `annotations` and `skills` jobs are deliberately not gated on
  # this: between them they read every path the pattern exempts, which is
  # exactly what a docs-only push changes.
  #
  # It fails open. When the range cannot be computed — a branch's first push,
  # where `event.before` is all zeros; a force push whose old tip is gone; a
  # manual dispatch, which sets no range at all — it reports `true` and every
  # lane runs. A filter that is wrong must be wrong in the direction of running
  # the lane, because the other direction lands a change nothing checked.
  changes:
    name: Change filter
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The default depth of 1 cannot diff against the previous tip.
          fetch-depth: 0

      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable range (before='${BEFORE:-}') — running every lane"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          if [ -z "$changed" ]; then
            echo "empty diff — running every lane"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          # Tested on the file list, not on grep's exit status: `grep -q -v`
          # is not portable between grep implementations.
          code_files="$(printf '%s\n' "$changed" | grep -vE '\.md$|^\.claude-plugin/|^skills/' || true)"
          if [ -n "$code_files" ]; then
            echo "outside the documentation paths, so every lane runs:"
            printf '%s\n' "$code_files" | sed 's/^/  /'
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only — skipping the five macOS lanes"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Fast lane ────────────────────────────────────────────────────
  # Runs first, and alone, because it catches most template regressions in
  # about a minute: it is the only lane that diffs the generated output against
  # a recorded snapshot, and the only one that compiles it in the Swift 6
  # language mode. It needs no simulator and no third-party package.
  checks:
    name: Checks (snapshot, both language modes, behaviour)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Sourcery artifact bundle
        # Keyed on the version alone: the bundle at a given version is
        # immutable, so there is nothing else for the key to depend on.
        uses: actions/cache@v5
        with:
          path: .build/sourcery-${{ env.SOURCERY_VERSION }}
          key: sourcery-${{ runner.os }}-${{ env.SOURCERY_VERSION }}

      - name: Toolchain
        run: swift --version

      - name: Run checks
        run: Tests/Checks/run-checks.sh

  # ── CLI lane ─────────────────────────────────────────────────────
  # The mock-templates executable: `generate` transparency against the fast
  # lane's snapshot, fingerprint validation and its red controls, imprint
  # recovery. Runs beside `checks`, not behind it — it compiles the CLI
  # package target, which the other lanes never touch, and finishes in about
  # a minute.
  cli:
    name: CLI (mock-templates build + checks)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Sourcery artifact bundle
        uses: actions/cache@v5
        with:
          path: .build/sourcery-${{ env.SOURCERY_VERSION }}
          key: sourcery-${{ runner.os }}-${{ env.SOURCERY_VERSION }}

      - name: Run CLI checks
        run: Tests/Checks/run-cli-checks.sh

  # ── Plugin lane ──────────────────────────────────────────────────
  # The SPM build-tool plugin, black-box over Tests/Checks/PluginFixture: the
  # derived source closure, the synthesized config, the defaults it supplies and
  # the five red controls that must stay red. Runs beside `checks` and `cli`
  # rather than behind them — it needs no simulator, and it is the only lane that
  # exercises the plugin's own logic (the example lane exercises the plugin, but
  # through one package shape).
  plugin:
    name: Plugin (source closure, synthesized config, red controls)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache the fixtures' resolved dependencies
        # All five fixture packages share one SwiftPM cache, so the pinned
        # Sourcery artifact bundle and swift-argument-parser are fetched once.
        uses: actions/cache@v5
        with:
          path: .build/plugin-checks/cache
          key: plugin-checks-${{ runner.os }}-${{ env.SOURCERY_VERSION }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: plugin-checks-${{ runner.os }}-${{ env.SOURCERY_VERSION }}-

      - name: Run plugin checks
        run: Tests/Checks/run-plugin-checks.sh

  # ── Xcode lane ───────────────────────────────────────────────────
  # The other half of the plugin. `plugin` above runs it through
  # `PackagePlugin`; an Xcode project runs it through `XcodeBuildToolPlugin`,
  # which is handed no package graph, no dependency edges and no shipped
  # templates — so none of that lane's assertions carry over. Needs `xcodegen`,
  # which generates the fixture project from a committed spec, and no simulator,
  # so it runs beside `checks` rather than behind it.
  xcode:
    name: Xcode (XcodeBuildToolPlugin over a generated project)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache the fixtures' resolved packages
        # Both projects here share one cloned-packages directory, so the pinned
        # Sourcery artifact bundle and swift-argument-parser are fetched once.
        uses: actions/cache@v5
        with:
          path: .build/xcode-checks/SourcePackages
          key: xcode-checks-${{ runner.os }}-${{ env.SOURCERY_VERSION }}-${{ hashFiles('Package.swift') }}
          restore-keys: xcode-checks-${{ runner.os }}-${{ env.SOURCERY_VERSION }}-

      - name: Run Xcode checks
        run: Tests/Checks/run-xcode-checks.sh

  # ── Full lane ────────────────────────────────────────────────────
  # Covers what the fast lane structurally cannot: the RxSwift smart defaults
  # (`Single`, `Observable`, `AnyObserver`, `Disposable`), the RIBs
  # external-protocol annotation pattern, the TypeErase template, and the SPM
  # build-tool plugin — which is how most consumers invoke the templates, and
  # which only exists inside a real package build. Gated on `checks` so a
  # broken template does not also pay for a simulator boot and six package
  # resolutions.
  example-project:
    name: Example project (RxSwift, RIBs, type erasure, SPM plugin)
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: List simulators
        # test-ios.sh resolves the newest installed iOS runtime's UDID. Logging
        # the available devices makes a resolution failure diagnosable from the
        # run alone.
        run: xcrun simctl list devices available

      - name: Run example project tests
        working-directory: Tests/Examples/ExampleProjectSpm
        run: ./test-ios.sh
        # If this lane's wall time becomes a problem, the fix is to teach
        # test-ios.sh a `-derivedDataPath` and cache it, the way the
        # modaal-firebase-wrappers workflow caches `.build/DerivedData`.
