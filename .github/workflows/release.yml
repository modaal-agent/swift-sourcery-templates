name: Release

# Tag-triggered. ci.yml deliberately skips tag pushes — a tag is cut from a
# commit already built on its branch push — so this workflow is the only one
# a tag runs, and it does no re-testing: it assembles the release assets and
# publishes them on the tag's GitHub release. The assembly script's smoke
# test (generate + validate from the shipped layout) is the gate that runs
# here; if it fails, nothing is published.
on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

# Same pin, same reason, as ci.yml.
env:
  XCODE_VERSION: '26.3'

jobs:
  release:
    name: Assemble and publish the release assets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Assemble release assets
        # The tag name is the version — tags are bare semver (e.g. 0.6.0).
        run: Scripts/assemble-release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file .build/release-assets/notes.md \
            .build/release-assets/*.zip \
            .build/release-assets/*.sha256
